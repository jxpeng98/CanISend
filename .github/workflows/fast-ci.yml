name: fast-ci

on:
  push:
    branches:
      - main
      - rewrite/rust-native
      - "feat/**"
      - "fix/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fast-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  desktop-ui:
    name: desktop-ui
    runs-on: macos-15
    timeout-minutes: 8
    defaults:
      run:
        working-directory: apps/canisend-desktop
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install pinned pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.17.0
          run_install: false

      - name: Install pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.5.0
          cache: pnpm
          cache-dependency-path: apps/canisend-desktop/pnpm-lock.yaml

      - name: Install locked desktop UI dependencies
        run: pnpm install --frozen-lockfile

      - name: Check desktop UI formatting
        run: pnpm format:check

      - name: Check Svelte and TypeScript
        run: pnpm check

      - name: Run desktop UI unit tests
        run: pnpm test

      - name: Test native preview evidence policy
        run: node --test ../../tools/native-preview/tests/qualification-evidence.test.mjs

      - name: Build production desktop UI
        run: pnpm build

      - name: Upload production desktop UI
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: canisend-desktop-ui-${{ github.sha }}
          path: apps/canisend-desktop/dist
          if-no-files-found: error
          retention-days: 1

  browser-keyboard-accessibility:
    name: browser-keyboard-accessibility
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    defaults:
      run:
        working-directory: apps/canisend-desktop
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install pinned pnpm for browser gate
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.17.0
          run_install: false

      - name: Install pinned Node.js for browser gate
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.5.0
          cache: pnpm
          cache-dependency-path: apps/canisend-desktop/pnpm-lock.yaml

      - name: Install locked browser-gate dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chrome for keyboard and accessibility gate
        run: pnpm exec playwright install --with-deps chrome

      - name: Run Chrome keyboard, accessibility, and key-visual checks
        run: pnpm test:accessibility

  cross-platform-core:
    name: core-${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            runner: ubuntu-24.04
            binary: target/debug/canisend
          - name: windows
            runner: windows-2025
            binary: target/debug/canisend.exe
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.0

      - name: Cache cross-platform core build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: fast-ci-core-${{ matrix.name }}

      - name: Test core, Store, IO, CLI, and MCP contracts
        run: cargo test --locked -p canisend-core -p canisend-store -p canisend-io -p canisend-cli -p canisend-mcp

      - name: Smoke Agent v3 MCP through the built CLI
        shell: bash
        run: >-
          ./scripts/smoke_agent_v3_mcp.sh
          "${{ matrix.binary }}"
          "$RUNNER_TEMP/canisend-fast-agent-v3-${{ matrix.name }}"

  macos-quality:
    name: macos-quality
    needs: desktop-ui
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Download exact production desktop UI
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: canisend-desktop-ui-${{ github.sha }}
          path: apps/canisend-desktop/dist

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy,rustfmt

      - name: Cache macOS quality build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: fast-ci-macos-quality

      - name: Start quality timing
        id: timing
        shell: bash
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Verify Apple Silicon development runner
        shell: bash
        run: |
          test "$(uname -s)" = "Darwin"
          test "$(uname -m)" = "arm64"

      - name: Reject active Python product files
        shell: bash
        run: |
          tracked="$(git ls-files '*.py' pyproject.toml uv.lock)"
          if [[ -n "$tracked" ]]; then
            echo "Rust-native branch contains forbidden Python product files:" >&2
            echo "$tracked" >&2
            exit 1
          fi

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Keep native preview tooling out of production builds
        shell: bash
        run: |
          if cargo tree --locked -p canisend-gui -e normal | \
            rg -Fq 'tauri-plugin-wdio-webdriver'; then
            echo "Test-only WebDriver plugin leaked into the default desktop graph" >&2
            exit 1
          fi
          if rg -Fq 'preview-qualification' .github/workflows/release.yml; then
            echo "Native release workflow must not enable preview-qualification" >&2
            exit 1
          fi

      - name: Run relevant Clippy targets
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Check generated contracts, resources, and release invariants
        run: cargo run -p xtask --locked -- release check

      - name: Record quality timing
        if: always()
        env:
          START_EPOCH: ${{ steps.timing.outputs.epoch }}
        shell: bash
        run: |
          elapsed="$(( $(date +%s) - START_EPOCH ))"
          {
            echo "### macOS quality timing"
            echo ""
            echo "- Elapsed seconds: $elapsed"
            echo "- Target: 300 seconds or less after cache warm-up"
          } >> "$GITHUB_STEP_SUMMARY"

  macos-tests:
    name: macos-tests
    needs: desktop-ui
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Download exact production desktop UI
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: canisend-desktop-ui-${{ github.sha }}
          path: apps/canisend-desktop/dist

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.0

      - name: Cache macOS test build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: fast-ci-macos-tests

      - name: Start test timing
        id: timing
        shell: bash
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Verify Apple Silicon development runner
        shell: bash
        run: |
          test "$(uname -s)" = "Darwin"
          test "$(uname -m)" = "arm64"

      - name: Run complete Rust suite on macOS
        run: cargo test --workspace --locked

      - name: Run generated property contracts
        run: cargo test -p canisend-contracts --locked --test property_contract

      - name: Build macOS development CLI and GUI
        run: >-
          cargo build --locked -p canisend-cli -p canisend-gui
          --features canisend-gui/custom-protocol

      - name: Smoke macOS development CLI
        shell: bash
        run: |
          workspace="$RUNNER_TEMP/canisend-smoke-workspace"
          backup="$RUNNER_TEMP/canisend-smoke-backup"
          restored="$RUNNER_TEMP/canisend-smoke-restored"
          first_uuid_id() {
            printf '%s' "$1" \
              | grep -oE '"id":"[0-9a-fA-F-]{36}"' \
              | sed -n '1p' \
              | cut -d'"' -f4
          }
          test -x ./target/debug/canisend
          test -x ./target/debug/canisend-gui
          file ./target/debug/canisend | grep -q arm64
          file ./target/debug/canisend-gui | grep -q arm64
          ./target/debug/canisend version --json
          ./target/debug/canisend doctor --json
          ./target/debug/canisend agent capabilities --json
          ./target/debug/canisend --workspace "$workspace" workspace init --pack academic-job --json
          ./target/debug/canisend --workspace "$workspace" workspace status --json
          ./target/debug/canisend --workspace "$workspace" workspace check --json
          job_json="$(./target/debug/canisend --workspace "$workspace" job create --title "Lecturer in Economics" --institution "University X" --json)"
          job_id="$(first_uuid_id "$job_json")"
          test -n "$job_id"
          ./target/debug/canisend --workspace "$workspace" job import "$job_id" --file fixtures/v2-spec/job-advert.md --json
          ./target/debug/canisend --workspace "$workspace" job show "$job_id" --json
          ./target/debug/canisend --workspace "$workspace" workflow start --job "$job_id" --json
          ./target/debug/canisend --workspace "$workspace" workflow begin --job "$job_id" --stage parse --mode host-agent --json
          ./target/debug/canisend --workspace "$workspace" workflow rerun --job "$job_id" --stage parse --json
          ./target/debug/canisend discovery import --file fixtures/v2-spec/discovery/leads.csv --source-name "Fast CI fixture" --dry-run --json
          ./target/debug/canisend --workspace "$workspace" discovery import --file fixtures/v2-spec/discovery/leads.csv --source-name "Fast CI fixture" --json
          lead_json="$(./target/debug/canisend --workspace "$workspace" discovery list --json)"
          lead_id="$(first_uuid_id "$lead_json")"
          test -n "$lead_id"
          ./target/debug/canisend --workspace "$workspace" discovery promote "$lead_id" --json
          ./target/debug/canisend --workspace "$workspace" workspace backup "$backup" --json
          ./target/debug/canisend workspace restore "$backup" "$restored" --json
          ./target/debug/canisend --workspace "$restored" workspace repair --json
          ./target/debug/canisend --workspace "$restored" workspace check --json
          ./scripts/smoke_host_agent.sh ./target/debug/canisend "$RUNNER_TEMP/canisend-host-agent-smoke"

      - name: Record test timing
        if: always()
        env:
          START_EPOCH: ${{ steps.timing.outputs.epoch }}
        shell: bash
        run: |
          elapsed="$(( $(date +%s) - START_EPOCH ))"
          {
            echo "### macOS test timing"
            echo ""
            echo "- Elapsed seconds: $elapsed"
            echo "- Target: 300 seconds or less after cache warm-up"
          } >> "$GITHUB_STEP_SUMMARY"
