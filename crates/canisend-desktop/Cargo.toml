[package]
name = "canisend-gui"
description = "Tauri and Svelte desktop application for CanISend"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "canisend-gui"
path = "src/main.rs"

[[bin]]
name = "canisend-fake-app-server"
path = "tests/fixtures/fake_app_server.rs"
required-features = ["app-server-test-fixture"]
test = false
bench = false

[features]
custom-protocol = ["tauri/custom-protocol"]
preview-qualification = ["dep:tauri-plugin-wdio-webdriver"]
app-server-test-fixture = []

[build-dependencies]
tauri-build.workspace = true

[dependencies]
canisend-app = { path = "../canisend-app", version = "=1.0.0-beta.4" }
canisend = { path = "../canisend-cli", version = "=1.0.0-beta.4" }
canisend-contracts = { path = "../canisend-contracts", version = "=1.0.0-beta.4" }
hex.workspace = true
open.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tauri.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-wdio-webdriver = { workspace = true, optional = true }
tauri-plugin-window-state.workspace = true

[lints]
workspace = true
