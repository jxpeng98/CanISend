[graph]
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
]
all-features = true

[advisories]
ignore = [
    { id = "RUSTSEC-2024-0320", reason = "unmaintained yaml-rust is transitively pinned by Typst; CanISend does not expose Typst YAML parsing" },
    { id = "RUSTSEC-2024-0370", reason = "unmaintained proc-macro-error is compile-time-only and reachable solely through Tauri's non-published GTK3 Linux GUI backend" },
    { id = "RUSTSEC-2024-0411", reason = "unmaintained gdkwayland-sys is reachable solely through Tauri's non-published GTK3 Linux GUI backend; Linux artifacts contain only the CLI" },
    { id = "RUSTSEC-2024-0412", reason = "unmaintained gdk is reachable solely through Tauri's non-published GTK3 Linux GUI backend; Linux artifacts contain only the CLI" },
    { id = "RUSTSEC-2024-0413", reason = "unmaintained atk is reachable solely through Tauri's non-published GTK3 Linux GUI backend; Linux artifacts contain only the CLI" },
    { id = "RUSTSEC-2024-0414", reason = "unmaintained gdkx11-sys is reachable solely through Tauri's non-published GTK3 Linux GUI backend; Linux artifacts contain only the CLI" },
    { id = "RUSTSEC-2024-0415", reason = "unmaintained gtk is reachable solely through Tauri's non-published GTK3 Linux GUI backend; Linux artifacts contain only the CLI" },
    { id = "RUSTSEC-2024-0416", reason = "unmaintained atk-sys is reachable solely through Tauri's non-published GTK3 Linux GUI backend; Linux artifacts contain only the CLI" },
    { id = "RUSTSEC-2024-0417", reason = "unmaintained gdkx11 is reachable solely through Tauri's non-published GTK3 Linux GUI backend; Linux artifacts contain only the CLI" },
    { id = "RUSTSEC-2024-0418", reason = "unmaintained gdk-sys is reachable solely through Tauri's non-published GTK3 Linux GUI backend; Linux artifacts contain only the CLI" },
    { id = "RUSTSEC-2024-0419", reason = "unmaintained gtk3-macros is reachable solely through Tauri's non-published GTK3 Linux GUI backend; Linux artifacts contain only the CLI" },
    { id = "RUSTSEC-2024-0420", reason = "unmaintained gtk-sys is reachable solely through Tauri's non-published GTK3 Linux GUI backend; Linux artifacts contain only the CLI" },
    { id = "RUSTSEC-2024-0436", reason = "unmaintained paste is a transitive Typst compile-time macro dependency with no runtime input surface" },
    { id = "RUSTSEC-2025-0075", reason = "unmaintained unic-char-range is pinned by Tauri urlpattern; only checked-in Tauri capability and application patterns are accepted" },
    { id = "RUSTSEC-2025-0080", reason = "unmaintained unic-common is pinned by Tauri urlpattern; only checked-in Tauri capability and application patterns are accepted" },
    { id = "RUSTSEC-2025-0081", reason = "unmaintained unic-char-property is pinned by Tauri urlpattern; only checked-in Tauri capability and application patterns are accepted" },
    { id = "RUSTSEC-2025-0098", reason = "unmaintained unic-ucd-version is pinned by Tauri urlpattern; only checked-in Tauri capability and application patterns are accepted" },
    { id = "RUSTSEC-2025-0100", reason = "unmaintained unic-ucd-ident is pinned by Tauri urlpattern; only checked-in Tauri capability and application patterns are accepted" },
    { id = "RUSTSEC-2025-0141", reason = "unmaintained bincode is transitively pinned by Typst syntax assets and receives no CanISend serialized input" },
    { id = "RUSTSEC-2026-0192", reason = "unmaintained ttf-parser processes only embedded, release-verified fonts; no user font discovery is enabled" },
    { id = "RUSTSEC-2026-0194", reason = "quick-xml 0.38.4 is compiled only through Typst bibliography support; CanISend accepts no bibliography, CSL, or XML render input and the fixed projector never invokes that helper" },
    { id = "RUSTSEC-2026-0195", reason = "quick-xml 0.38.4 is compiled only through Typst bibliography support; CanISend accepts no bibliography, CSL, or XML render input and the fixed projector never invokes namespace parsing" },
    { id = "RUSTSEC-2026-0206", reason = "unmaintained rustybuzz shapes only embedded, release-verified fonts; no user font discovery is enabled" },
]

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "GPL-3.0-only",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.93

[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "simplest-path"
workspace-default-features = "allow"
external-default-features = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
